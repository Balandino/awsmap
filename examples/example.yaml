---
Diagram:
  DefinitionFiles:
    - Type: LocalFile
      LocalFile: ../imgs/dark_imgs.yaml
  Resources:
    Canvas:
      Type: AWS::Diagram::Canvas
      Direction: vertical
      Children: [AWSCloud, User]
      FillColor: rgba(0, 0, 0, 255)
    AWSCloud:
      Type: AWS::Diagram::Cloud
      Direction: vertical
      Preset: AWSCloudNoLogo
      Align: center
      Children:
        - VPC
    # VPC
    VPC:
      Type: AWS::EC2::VPC
      Direction: vertical
      Children: [VPCPublicStack, ALB]
      BorderChildren:
        - Position: S
          Resource: IGW
    VPCPublicStack:
      Type: AWS::AutoScaling::AutoScalingGroup
      Children: [VPCPublicSubnet1Instance, VPCPublicSubnet2Instance]
    VPCPublicSubnet1Instance:
      Type: AWS::EC2::Instance
    VPCPublicSubnet2Instance:
      Type: AWS::EC2::Instance
    ALB:
      Type: AWS::ElasticLoadBalancingV2::LoadBalancer
      Preset: Application Load Balancer
    IGW:
      Type: AWS::EC2::InternetGateway
      IconFill:
        Type: rect
        Color: rgba(0, 0, 0, 255)
    User:
      Type: AWS::Diagram::Resource
      Preset: User
  Links:
    - Source: ALB
      SourcePosition: NNW
      Target: VPCPublicSubnet1Instance
      TargetPosition: S
      TargetArrowHead:
        Type: Open
      Type: orthogonal
      Labels:
        SourceLeft:
          Title: HTTP:80
      LineColor: rgba(255, 255, 255, 255)
    - Source: ALB
      SourcePosition: NNE
      Target: VPCPublicSubnet2Instance
      TargetPosition: S
      TargetArrowHead:
        Type: Open
      Type: orthogonal
      Labels:
        SourceRight:
          Title: HTTP:80
      LineColor: rgba(255, 255, 255, 255)
    - Source: IGW
      SourcePosition: N
      Target: ALB
      TargetPosition: S
      TargetArrowHead:
        Type: Open
      Type: orthogonal
      Labels:
        SourceLeft:
          Title: HTTP:80
        SourceRight:
          Title: HTTPS:443
      LineColor: rgba(255, 255, 255, 255)
    - Source: User
      SourcePosition: N
      Target: IGW
      TargetPosition: S
      TargetArrowHead:
        Type: Open
      Type: orthogonal
      LineColor: rgba(255, 255, 255, 255)
